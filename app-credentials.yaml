# App credentials (databases, JWT key), synced by External Secrets Operator from AWS Secrets Manager.
# Values are generated by Terraform (infrastructure repo: persistent/secrets.tf) and
# never appear in Git. Key names match what the apps already read.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: accounts-db-credentials
  namespace: cymbal-bank
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: accounts-db-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        POSTGRES_PASSWORD: "{{ .password }}"
        ACCOUNTS_DB_URI: "postgresql://accounts-admin:{{ .password }}@accounts-db:5432/accounts-db"
  data:
    - secretKey: password
      remoteRef:
        key: cymbal-bank/app/accounts-db
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ledger-db-credentials
  namespace: cymbal-bank
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: ledger-db-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        POSTGRES_PASSWORD: "{{ .password }}"
        SPRING_DATASOURCE_PASSWORD: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: cymbal-bank/app/ledger-db
        property: password
---
# RSA key pair that signs and verifies login tokens. Same Secret name and keys as
# before, so the six workloads mounting "jwt-key" don't change.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jwt-key
  namespace: cymbal-bank
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: jwt-key
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        jwtRS256.key: "{{ .private_key }}"
        jwtRS256.key.pub: "{{ .public_key }}"
  dataFrom:
    - extract:
        key: cymbal-bank/app/jwt-key
